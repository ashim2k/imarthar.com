<style>

  .errlist { display: flex; flex-direction: column; gap: 10px; max-height: 560px; overflow: auto; }

  .chip { border: 1px solid #d1fae5; background: #f0fdf4; color: #065f46; border-radius: 99px; padding: 3px 12px; font: inherit; font-size: 15px; cursor: pointer; }
  .chip:hover { background: #10b981; color: #fff; border-color: #10b981; }
  .chip small { color: inherit; opacity: .6; font-size: 11px; margin-left: 4px; }

  #pop { position: absolute; z-index: 300; background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 10px; box-shadow: 0 12px 28px rgba(15,23,42,.16); min-width: 190px; max-width: 320px; display: none; }
  #pop.show { display: block; }
  #pop .ph { font-size: 12px; color: #94a3b8; margin-bottom: 6px; }

  details.help { margin-top: 1.25rem; font-size: 13px; color: #64748b; line-height: 1.8; }

    <h1>ইমার ঠারর বানান <span>পরীক্ষক</span></h1>
    <p>Bishnupriya Manipuri Spell Checker — v1.02 </p>
  </div>
</div>

<div class="main">
  <div class="grid">
    <div class="stack">
      <div class="card">
        <h2>আপনাগাসির ইকরা <small id="count"></small></h2>
        <textarea id="input" spellcheck="false" placeholder="এপেই বিষ্ণুপ্রিয়া মণিপুরি ঠারে ইকরিক বা ইকরাহান কপি-পেস্ট করিক"></textarea>
        <div class="toolbar">
          <button class="btn primary" id="fixAll" disabled>পয়লা সাজেশন ইলয়া চুমকরিক</button>
          <button class="btn" id="copy">কপি</button>
          <button class="btn" id="sample">উদাহরণ</button>
          <button class="btn" id="clear">ক্লিয়ার</button>
          <span class="spacer"></span>
          <label class="opt" title="উদাহরণ - বাক্যর লগে মেশিন জেনেরেটডে প্রত্যয় উতার বিতরে লেইলেইক থাইতে পারে।"><input type="checkbox" id="strict"> স্ট্রিক্ট মোড</label>
        </div>
      </div>
      <div class="card">
        <h2>চিহ্নিত ইকরা <span class="status" id="status">—</span></h2>
        <div id="marked"></div>
      </div>
    </div>

    <div class="card">
      <h2>ভুল বারো সাজেশন <small id="elcount"></small></h2>
      <div class="errlist" id="errlist"></div>
    </div>
  </div>
</div>
<div id="pop" role="menu"></div>

<footer>© ২০২৬ <span>imarthar.com</span> • Developed by কুঙ্গ থাঙ<br><small style="color:#94a3b8;">Preserving heritage through advanced computing systems.</small></footer>

<script>
var API_URL = "https://clybuzkhnjuhpvcobiri.supabase.co/functions/v1/spellcheck";
var SAMPLE = "কামহাণ অইব-নাইব আহান মাতিক। বিয়ানকার আটানিহান গারিগরকা হবা।";

(function () {
  "use strict";
  // ---------------------------------------------------------------- normalise
  var NUKTA = [["ড়", "ড়"], ["ঢ়", "ঢ়"], ["য়", "য়"]];
  function norm(w) {
    w = w.normalize("NFC").replace(/[‌‍]/g, "").replace(/’/g, "'");
    for (var i = 0; i < NUKTA.length; i++) w = w.split(NUKTA[i][0]).join(NUKTA[i][1]);
    return w;
  }

  // ---------------------------------------------------------------- ব্যবহারকারীর নিজস্ব তালিকা (শুধু এই ব্রাউজারে)
  var strict = false;
  var personal = {}, ignored = new Set();
  try { personal = JSON.parse(localStorage.getItem("bpm_personal") || "{}") || {}; } catch (e) { personal = {}; }

  // ---------------------------------------------------------------- সার্ভার থেকে যাচাই (ডেটা ব্রাউজারে আসে না)
  var seq = 0;
  function remoteCheck(text) {
    return fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text: text, strict: strict })
    }).then(function (r) {
      if (!r.ok) { var e = new Error("http"); e.status = r.status; throw e; }
      return r.json();
    });
  }
  function mine(r) {
    var errs = r.errors.filter(function (e) { var n = norm(e.word); return !ignored.has(n) && !personal[n]; });
    return { errors: errs, total: r.total };
  }

  // ---------------------------------------------------------------- UI
  var $ = function (id) { return document.getElementById(id); };
  var input = $("input"), marked = $("marked"), errlist = $("errlist"), pop = $("pop"), statusEl = $("status");
  var state = { errors: [], total: 0 }, timer = null;

  function toast(msg) {
    var t = $("toast"); t.textContent = msg; t.classList.add("show");
    clearTimeout(toast.h); toast.h = setTimeout(function () { t.classList.remove("show"); }, 2200);
  }
  function bn(n) { return n.toLocaleString("bn-BD"); }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

  function replaceAt(err, term) {
    var v = input.value;
    input.value = v.slice(0, err.start) + term + v.slice(err.end);
    closePop(); run(); input.focus();
  }
  function ignoreWord(err) { ignored.add(norm(err.word)); closePop(); rerender(); }
  function learnWord(err) {
    var w = norm(err.word); personal[w] = 1;
    try { localStorage.setItem("bpm_personal", JSON.stringify(personal)); } catch (e) {}
    closePop(); rerender(); toast("“" + w + "” অভিধানে যোগ করানি অইল");
  }

  function chips(err, container) {
    err.sug.forEach(function (s) {
      var b = el("button", "chip", s.term); b.type = "button";
      if (s.dist > 1) b.appendChild(el("small", null, "দূরেইপা " + bn(s.dist)));
      b.addEventListener("click", function (e) { e.stopPropagation(); replaceAt(err, s.term); });
      container.appendChild(b);
    });
  }
  function actions(err, container) {
    var a = el("button", null, "অভিধানে যোগ করিক"); a.type = "button"; a.addEventListener("click", function (e) { e.stopPropagation(); learnWord(err); });
    var b = el("button", null, "এক্ক থাক"); b.type = "button"; b.addEventListener("click", function (e) { e.stopPropagation(); ignoreWord(err); });
    container.appendChild(a); container.appendChild(b);
  }

  function render() {
    var text = input.value, errs = state.errors;
    $("count").textContent = text.length ? bn(state.total) + " ওয়াহি" : "";
    // highlighted copy of the text (built with text nodes only)
    marked.textContent = "";
    if (!text.trim()) { marked.appendChild(el("span", "empty", "ইকরাহান এপেই দিলে বানান উতা চুমকরানি অইতয়")); }
    else {
      var pos = 0;
      errs.forEach(function (err, i) {
        if (err.start > pos) marked.appendChild(document.createTextNode(text.slice(pos, err.start)));
        var s = el("span", "err" + (err.sug.length ? "" : " nosug"), text.slice(err.start, err.end));
        s.dataset.i = i; s.tabIndex = 0;
        s.addEventListener("click", function (e) { e.stopPropagation(); openPop(i, s); });
        s.addEventListener("keydown", function (e) { if (e.key === "Enter") openPop(i, s); });
        marked.appendChild(s); pos = err.end;
      });
      if (pos < text.length) marked.appendChild(document.createTextNode(text.slice(pos)));
    }
    // status
    statusEl.className = "status";
    if (!text.trim()) statusEl.textContent = "—";
    else if (!errs.length) { statusEl.textContent = "এবাকাউ কোনো ভুল নাপাসি ✓"; statusEl.classList.add("ok"); }
    else { statusEl.textContent = bn(errs.length) + "হান ভুল"; statusEl.classList.add("bad"); }
    // list
    errlist.textContent = ""; $("elcount").textContent = errs.length ? bn(errs.length) + "হান" : "";
    if (!errs.length) errlist.appendChild(el("div", "none", text.trim() ? "হাবি ওয়াহি অভিধান বারো প্রত্যয়-নিয়মর লগে চান্না অসে" : "এপেই কোনো ইকরা নেই"));
    errs.forEach(function (err, i) {
      var item = el("div", "eitem"), w = el("div", "w", err.word);
      w.addEventListener("click", function () { var t = marked.querySelector('[data-i="' + i + '"]'); if (t) { t.scrollIntoView({ block: "center" }); openPop(i, t); } });
      item.appendChild(w);
      if (err.sug.length) { var c = el("div", "chips"); chips(err, c); item.appendChild(c); }
      else item.appendChild(el("div", "none", "কাদাবারার কোনো ওয়াহি বিসারিয়া নাপাসি"));
      var m = el("div", "mini"); actions(err, m); item.appendChild(m);
      errlist.appendChild(item);
    });
    $("fixAll").disabled = !errs.some(function (e) { return e.sug.length && e.sug[0].dist <= 1; });
  }

  function openPop(i, anchor) {
    var err = state.errors[i]; pop.textContent = "";
    Array.prototype.forEach.call(marked.querySelectorAll(".err.open"), function (n) { n.classList.remove("open"); });
    anchor.classList.add("open");
    pop.appendChild(el("div", "ph", err.sug.length ? "সাজেশন" : "কাদাবারার কোনো ওয়াহি নেই"));
    if (err.sug.length) { var c = el("div", "chips"); chips(err, c); pop.appendChild(c); }
    var m = el("div", "mini"); actions(err, m); pop.appendChild(m);
    pop.classList.add("show");
    var r = anchor.getBoundingClientRect(), pw = pop.offsetWidth;
    var left = Math.min(Math.max(8, r.left + window.scrollX), window.scrollX + document.documentElement.clientWidth - pw - 8);
    pop.style.left = left + "px"; pop.style.top = (r.bottom + window.scrollY + 6) + "px";
  }
  function closePop() {
    pop.classList.remove("show");
    Array.prototype.forEach.call(document.querySelectorAll(".err.open"), function (n) { n.classList.remove("open"); });
  }

  var lastRaw = null;
  function rerender() { var r = mine(lastRaw); state.errors = r.errors; state.total = r.total; render(); }
  function run() {
    var text = input.value, my = ++seq;
    if (!text.trim()) { lastRaw = { errors: [], total: 0 }; rerender(); return; }
    statusEl.className = "status"; statusEl.textContent = "যাচাই অর..";
    remoteCheck(text).then(function (r) {
      if (my !== seq) return;            // পুরনো উত্তর বাদ
      lastRaw = r; rerender();
    }).catch(function (e) {
      if (my !== seq) return;
      statusEl.className = "status bad";
      statusEl.textContent = e && e.status === 429 ? "রিকুয়েস্ট বপসে — খানিচুয়া পিসেদ বারো চেস্টা করিক" :
                             e && e.status === 413 ? "ইকরাহান নিয়াম ডাঙর অসে (সর্বোচ্চ ৬০০০ অক্ষর)" : "সার্ভারগর লগে সংযোগ নাসে";
    });
  }

  input.addEventListener("input", function () { closePop(); clearTimeout(timer); timer = setTimeout(run, 450); });
  document.addEventListener("click", function (e) { if (!pop.contains(e.target)) closePop(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closePop(); });
  window.addEventListener("resize", closePop);

  $("fixAll").addEventListener("click", function () {
    var v = input.value, n = 0;
    state.errors.slice().sort(function (a, b) { return b.start - a.start; }).forEach(function (e) {
      if (e.sug.length && e.sug[0].dist <= 1) { v = v.slice(0, e.start) + e.sug[0].term + v.slice(e.end); n++; }
    });
    input.value = v; run(); toast(bn(n) + "হান ভুল অসে");
  });
  $("copy").addEventListener("click", function () {
    var done = function () { toast("কপি অইল"); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(input.value).then(done, function () { input.select(); document.execCommand("copy"); done(); });
    else { input.select(); document.execCommand("copy"); done(); }
  });
  $("clear").addEventListener("click", function () { input.value = ""; ignored.clear(); run(); input.focus(); });
  $("sample").addEventListener("click", function () { input.value = SAMPLE; run(); });
  $("strict").addEventListener("change", function (e) { strict = e.target.checked; run(); });

  run();
})();
</script>
