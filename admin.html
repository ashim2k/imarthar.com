<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>মডারেশন ড্যাশবোর্ড — ইমার ঠার</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f8fafc; color: #1e293b; line-height: 1.5; }

  nav {
    background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(226, 232, 240, 0.8);
    padding: 0 2rem; display: flex; align-items: center; justify-content: space-between;
    height: 64px; position: sticky; top: 0; z-index: 100;
  }
  .logo { font-size: 22px; font-weight: 700; color: #0f172a; text-decoration: none; }
  .logo span { color: #10b981; }
  .badge { font-size: 12px; font-weight: 700; background: #fef3c7; color: #92400e; padding: 4px 12px; border-radius: 99px; }

  .container { max-width: 900px; margin: 3rem auto; padding: 0 2rem; }
  .page-title { font-size: 26px; font-weight: 800; color: #0f172a; margin-bottom: 0.4rem; }
  .page-desc { color: #64748b; font-size: 14px; margin-bottom: 2rem; }

  .tabs { display: flex; gap: 8px; margin-bottom: 1.75rem; }
  .tab-btn {
    border: 1px solid #e2e8f0; background: #fff; color: #64748b; font-size: 13.5px; font-weight: 600;
    padding: 8px 16px; border-radius: 10px; cursor: pointer;
  }
  .tab-btn.active { background: #0f172a; color: #fff; border-color: #0f172a; }

  .empty-state { text-align: center; color: #94a3b8; padding: 3rem 1rem; background: #fff; border: 1px dashed #e2e8f0; border-radius: 16px; font-size: 14px; }

  .sub-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 1.5rem; margin-bottom: 1.25rem; }
  .sub-head { display: flex; gap: 14px; margin-bottom: 1rem; }
  .sub-thumb { width: 90px; height: 68px; border-radius: 10px; object-fit: cover; background: #f1f5f9; flex-shrink: 0; }
  .sub-title { font-size: 16.5px; font-weight: 700; color: #0f172a; margin-bottom: 4px; }
  .sub-meta { font-size: 12.5px; color: #94a3b8; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .sub-tag { font-size: 11px; font-weight: 700; background: #f0fdf4; color: #166534; padding: 2px 10px; border-radius: 99px; }
  .status-pill { font-size: 11px; font-weight: 700; padding: 2px 10px; border-radius: 99px; }
  .status-pending { background: #fef3c7; color: #92400e; }
  .status-published { background: #f0fdf4; color: #166534; }
  .status-rejected { background: #fee2e2; color: #991b1b; }

  .sub-body { font-size: 13.5px; color: #475569; white-space: pre-wrap; max-height: 110px; overflow: hidden; border-top: 1px solid #f1f5f9; padding-top: .85rem; margin-bottom: 1rem; position: relative; }
  .sub-body.expanded { max-height: none; }
  .expand-link { font-size: 12.5px; color: #10b981; cursor: pointer; font-weight: 600; }

  .sub-actions { display: flex; gap: 10px; }
  .btn { border: none; border-radius: 10px; padding: 9px 16px; font-size: 13.5px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  .btn-publish { background: #10b981; color: #fff; }
  .btn-publish:hover { background: #059669; }
  .btn-reject { background: #fee2e2; color: #991b1b; }
  .btn-reject:hover { background: #fecaca; }
  .btn:disabled { opacity: .55; cursor: not-allowed; }
  .btn-link { background: #f1f5f9; color: #334155; }
  .btn-link:hover { background: #e2e8f0; }

  @keyframes spin { to { transform: rotate(360deg); } }
  .spinning { display: inline-block; animation: spin 0.8s linear infinite; }

  .toast { position: fixed; bottom: 24px; right: 24px; background: #0f172a; color: #fff; padding: 12px 18px; border-radius: 12px; font-size: 13.5px; box-shadow: 0 10px 25px -5px rgba(0,0,0,.25); opacity: 0; transform: translateY(10px); transition: all .25s; pointer-events: none; z-index: 400; }
  .toast.visible { opacity: 1; transform: translateY(0); }
  .toast.error { background: #991b1b; }

  /* ── লগইন স্ক্রিন ── */
  #login-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem; }
  .login-card { width: 100%; max-width: 360px; background: #fff; border: 1px solid #e2e8f0; border-radius: 20px; padding: 2rem; box-shadow: 0 10px 25px -5px rgba(0,0,0,.05); }
  .login-logo { font-size: 20px; font-weight: 700; color: #0f172a; margin-bottom: .3rem; }
  .login-logo span { color: #10b981; }
  .login-sub { font-size: 13.5px; color: #64748b; margin-bottom: 1.5rem; }
  .login-error { display: none; background: #fee2e2; color: #991b1b; font-size: 13px; padding: 10px 14px; border-radius: 10px; margin-bottom: 1rem; }
  .login-error.visible { display: block; }
  #app-root { display: none; }
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">imar<span>thar</span>.com</div>
    <div class="login-sub">অ্যাডমিন ড্যাশবোর্ডে লগইন করিক</div>
    <div class="login-error" id="login-error"></div>
    <form id="login-form">
      <div class="form-group" style="margin-bottom:1rem;">
        <label class="form-label" style="display:block;font-size:13px;font-weight:600;color:#475569;margin-bottom:6px;">ইমেইল</label>
        <input type="email" id="login-email" required class="form-input" style="width:100%;padding:10px 14px;border:1px solid #e2e8f0;border-radius:10px;font-size:14px;outline:none;">
      </div>
      <div class="form-group" style="margin-bottom:1.25rem;">
        <label class="form-label" style="display:block;font-size:13px;font-weight:600;color:#475569;margin-bottom:6px;">পাসওয়ার্ড</label>
        <input type="password" id="login-password" required class="form-input" style="width:100%;padding:10px 14px;border:1px solid #e2e8f0;border-radius:10px;font-size:14px;outline:none;">
      </div>
      <button type="submit" class="btn btn-publish" id="login-btn" style="width:100%;justify-content:center;">লগইন করিক</button>
    </form>
  </div>
</div>

<div id="app-root">
  <nav>
    <a href="blogs.html" class="logo">imar<span>thar</span>.com <span style="color:#64748b; font-weight:500; font-size:13px;">/ admin</span></a>
    <div style="display:flex; align-items:center; gap:14px;">
      <span class="badge" id="pending-count-badge">— পেন্ডিং</span>
      <button class="btn btn-link" onclick="logout()" style="padding:6px 12px;"><i class="ti ti-logout"></i> লগআউট</button>
    </div>
  </nav>

  <div class="container">
    <h1 class="page-title">ব্লগ মডারেশন</h1>
    <p class="page-desc">সাবমিট করা ব্লগ পোস্ট রিভিউ করিয়া পাবলিশ বা বাতিল করিক। পাবলিশ করলে টেমপ্লেট থনে স্বয়ংক্রিয়ভাবে HTML পেজ হংকরিয়া Supabase Storage-এ আপলোড অইতয়।</p>

    <div class="tabs">
      <button class="tab-btn active" data-status="pending" onclick="switchTab('pending')">পেন্ডিং</button>
      <button class="tab-btn" data-status="published" onclick="switchTab('published')">পাবলিশড</button>
      <button class="tab-btn" data-status="rejected" onclick="switchTab('rejected')">বাতিল</button>
    </div>

    <div id="list-container">
      <div class="empty-state">লোড অসের...</div>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // ── কনফিগ ──────────────────────────────────────────────
  const SUPABASE_URL = 'https://ksnwykmtrczvdzhoiews.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_rDe8p4jNcIyz9THgpFUKrw_51BinZno';
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // ── Supabase Auth লগইন গার্ড ───────────────────────────
  function showLogin() {
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('app-root').style.display = 'none';
  }
  function showApp() {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app-root').style.display = 'block';
    loadSubmissions();
  }

  document.getElementById('login-form').addEventListener('submit', async function (e) {
    e.preventDefault();
    const errBox = document.getElementById('login-error');
    errBox.classList.remove('visible');
    const btn = document.getElementById('login-btn');
    btn.disabled = true;
    btn.innerHTML = '<i class="ti ti-loader-2 spinning"></i> লগইন অসের...';

    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;

    const { error } = await supabaseClient.auth.signInWithPassword({ email, password });

    btn.disabled = false;
    btn.textContent = 'লগইন করিক';

    if (error) {
      errBox.textContent = 'লগইন ব্যর্থ: ইমেইল বা পাসওয়ার্ড ভুল।';
      errBox.classList.add('visible');
      return;
    }
    showApp();
  });

  async function logout() {
    await supabaseClient.auth.signOut();
    showLogin();
  }

  // পেজ লোড অইলে বর্তমান সেশন আছে কিনা চেইক করিক
  supabaseClient.auth.getSession().then(({ data }) => {
    if (data.session) showApp();
    else showLogin();
  });

  // অন্য ট্যাবে লগইন/লগআউট অইলেও সিঙ্ক থাকারকা
  supabaseClient.auth.onAuthStateChange((_event, session) => {
    if (session) showApp(); else showLogin();
  });

  let currentTab = 'pending';
  let allRows = [];

  // ── হেল্পার ────────────────────────────────────────────
  function escapeHtml(str) {
    return String(str || '')
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  const BN_DIGITS = ['০','১','২','৩','৪','৫','৬','৭','৮','৯'];
  function toBnDigits(n) {
    return String(n).replace(/[0-9]/g, d => BN_DIGITS[d]);
  }

  const BN_MONTHS = ['জানুয়ারি','ফেব্রুয়ারি','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টেম্বর','অক্টোবর','নভেম্বর','ডিসেম্বর'];
  function formatBnDate(date) {
    return `${BN_MONTHS[date.getMonth()]} ${toBnDigits(date.getFullYear())}`;
  }

  function avatarInitials(name) {
    const parts = String(name || '').trim().split(/\s+/).filter(Boolean);
    if (parts.length >= 2) return parts[0][0] + parts[1][0];
    if (parts.length === 1) return parts[0].slice(0, 2);
    return '?';
  }

  function paragraphsHtml(body) {
    return String(body || '')
      .split(/\n{1,}/)
      .map(line => line.trim())
      .filter(Boolean)
      .map(line => `<p>${escapeHtml(line)}</p>`)
      .join('\n');
  }

  function estimateReadMinutes(body) {
    const words = String(body || '').split(/\s+/).filter(Boolean).length;
    return Math.max(1, Math.round(words / 180));
  }

  function excerpt(body, len) {
    const clean = String(body || '').replace(/\s+/g, ' ').trim();
    return clean.length > len ? clean.slice(0, len).trim() + '…' : clean;
  }

  const FALLBACK_IMG =
    'data:image/svg+xml;utf8,' + encodeURIComponent(
      `<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320">
        <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#10b981"/><stop offset="1" stop-color="#0f766e"/>
        </linearGradient></defs>
        <rect width="900" height="320" fill="url(#g)"/>
        <text x="50%" y="52%" font-family="sans-serif" font-size="34" fill="#ffffff"
          text-anchor="middle" font-weight="700">imarthar.com</text>
      </svg>`
    );

  // ── ডেটা লোড ───────────────────────────────────────────
  async function loadSubmissions() {
    document.getElementById('list-container').innerHTML = '<div class="empty-state">লোড অসের...</div>';
    const { data, error } = await supabaseClient
      .from('blog_submissions')
      .select('*')
      .order('created_at', { ascending: false });

    if (error) {
      console.error(error);
      document.getElementById('list-container').innerHTML =
        '<div class="empty-state">ডেটা লোড করতে সমস্যা অসে। কনসোল চেইক করিক।</div>';
      return;
    }
    allRows = data || [];
    document.getElementById('pending-count-badge').textContent =
      toBnDigits(allRows.filter(r => (r.status || 'pending') === 'pending').length) + ' পেন্ডিং';
    renderList();
  }

  function switchTab(status) {
    currentTab = status;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.status === status));
    renderList();
  }

  function renderList() {
    const rows = allRows.filter(r => (r.status || 'pending') === currentTab);
    const container = document.getElementById('list-container');
    if (!rows.length) {
      container.innerHTML = '<div class="empty-state">এহানে এবাকা কিছু নাই।</div>';
      return;
    }
    container.innerHTML = '';
    rows.forEach(row => container.appendChild(renderCard(row)));
  }

  function renderCard(row) {
    const el = document.createElement('div');
    el.className = 'sub-card';
    const statusClass = { pending: 'status-pending', published: 'status-published', rejected: 'status-rejected' }[row.status || 'pending'];
    const statusLabel = { pending: 'পেন্ডিং', published: 'পাবলিশড', rejected: 'বাতিল' }[row.status || 'pending'];

    el.innerHTML = `
      <div class="sub-head">
        <img class="sub-thumb" src="${escapeHtml(row.img_url || FALLBACK_IMG)}" alt="">
        <div>
          <div class="sub-title">${escapeHtml(row.title)}</div>
          <div class="sub-meta">
            <span class="sub-tag">${escapeHtml(row.tag || 'সাধারণ')}</span>
            <span class="status-pill ${statusClass}">${statusLabel}</span>
            <span>লেখক: ${escapeHtml(row.author)}</span>
          </div>
        </div>
      </div>
      <div class="sub-body" id="body-${row.id}">${escapeHtml(row.body)}</div>
      <div class="expand-link" onclick="document.getElementById('body-${row.id}').classList.toggle('expanded')" style="margin-bottom:.85rem;">আরো দেখিক / লুকাইক</div>
      <div class="sub-actions" id="actions-${row.id}">
        ${row.status === 'pending' ? `
          <button class="btn btn-publish" onclick="publishRow('${row.id}')"><i class="ti ti-send"></i> পাবলিশ করিক</button>
          <button class="btn btn-reject" onclick="rejectRow('${row.id}')"><i class="ti ti-x"></i> বাতিল করিক</button>
        ` : ''}
        ${row.status === 'published' ? `
          <a class="btn btn-link" href="post.html?id=${encodeURIComponent(row.id)}" target="_blank"><i class="ti ti-external-link"></i> পেজ দেখিক</a>
        ` : ''}
      </div>
    `;
    return el;
  }

  function showToast(msg, isError) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast visible' + (isError ? ' error' : '');
    setTimeout(() => t.classList.remove('visible'), 3200);
  }

  // ── Approve → status আপডেট (post.html ডাইনামিকভাবে বাকি সব করবে) ──
  async function publishRow(id) {
    const row = allRows.find(r => r.id === id);
    if (!row) return;
    const btns = document.getElementById(`actions-${id}`);
    btns.innerHTML = '<button class="btn btn-publish" disabled><i class="ti ti-loader-2 spinning"></i> পাবলিশ অসের...</button>';

    try {
      const { error: updateError } = await supabaseClient
        .from('blog_submissions')
        .update({ status: 'published', published_at: new Date().toISOString() })
        .eq('id', id);

      if (updateError) throw updateError;

      showToast('পোস্ট পাবলিশ অইলো।');
      await loadSubmissions();
      switchTab('pending');
    } catch (err) {
      console.error(err);
      showToast('পাবলিশ করতে সমস্যা অসে: ' + (err.message || err), true);
      await loadSubmissions();
    }
  }

  async function rejectRow(id) {
    if (!confirm('এই পোস্টহান বাতিল করানি নিশ্চিত?')) return;
    const { error } = await supabaseClient.from('blog_submissions').update({ status: 'rejected' }).eq('id', id);
    if (error) {
      showToast('বাতিল করতে সমস্যা অসে।', true);
      return;
    }
    showToast('পোস্টহান বাতিল অইলো।');
    await loadSubmissions();
  }


</script>
</body>
</html>
