<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ব্লগ পোস্ট — ইমার ঠার</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: #f8fafc;
    color: #1e293b;
    line-height: 1.6;
  }

  nav {
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(226, 232, 240, 0.8);
    padding: 0 2rem; display: flex; align-items: center; justify-content: space-between;
    height: 64px; position: sticky; top: 0; z-index: 100;
  }
  .logo { font-size: 22px; font-weight: 700; color: #0f172a; text-decoration: none; }
  .logo span { color: #10b981; }
  .nav-links { display: flex; gap: 28px; }
  .nav-links a { font-size: 14px; font-weight: 500; color: #64748b; text-decoration: none; }
  .nav-links a:hover, .nav-links a.active { color: #10b981; }

  .container { max-width: 760px; margin: 3rem auto; padding: 0 2rem; }

  .back-link {
    display: inline-flex; align-items: center; gap: 6px; color: #10b981; text-decoration: none;
    font-size: 14px; font-weight: 600; margin-bottom: 1.5rem;
  }
  .back-link:hover { text-decoration: underline; }

  .post-tag { font-size: 11px; font-weight: 700; background: #f0fdf4; color: #166534; padding: 3px 12px; border-radius: 99px; display: inline-block; margin-bottom: 14px; }
  .post-title { font-size: 32px; font-weight: 800; color: #0f172a; margin-bottom: 12px; line-height: 1.3; }
  .post-meta { font-size: 13px; color: #94a3b8; margin-bottom: 24px; display: flex; align-items: center; gap: 6px; }
  .post-img { width: 100%; max-height: 420px; object-fit: cover; border-radius: 16px; margin-bottom: 2rem; background: #f1f5f9; }
  .post-body { font-size: 16px; color: #334155; white-space: pre-line; }

  .not-found { text-align: center; padding: 4rem 1rem; color: #64748b; }
  .not-found i { font-size: 40px; color: #cbd5e1; margin-bottom: 1rem; display: block; }

  footer { background: #ffffff; border-top: 1px solid #e2e8f0; padding: 2.5rem 2rem; text-align: center; font-size: 13px; color: #64748b; margin-top: 5rem;}
  footer span { color: #10b981; font-weight: 600; }

  @media (max-width: 640px) {
    .container { padding: 0 1.25rem; }
    .post-title { font-size: 24px; }
  }
</style>
</head>
<body>

<nav>
  <a href="../index.html" class="logo">imar<span>thar</span>.com</a>
  <div class="nav-links">
    <a href="../tools.html">টুল</a>
    <a href="../blogs.html" class="active">ব্লগ</a>
    <a href="../papers.html">পেপার</a>
    <a href="../discussion.html">আলোচনা</a>
  </div>
</nav>

<div class="container" id="post-container">
  <!-- জাভাস্ক্রিপ্ট দিয়ে কনটেন্ট বসানো হবে -->
</div>

<footer>
  © ২০২৬ <span>imarthar.com</span> • Developed by কুঙ্গ থাঙ<br>
  <small style="color: #94a3b8;">Preserving heritage through advanced computing systems.</small>
</footer>

<script>
  function renderPost() {
    const params = new URLSearchParams(window.location.search);
    const id = parseInt(params.get('id'), 10);
    const container = document.getElementById('post-container');

    const storedBlogs = JSON.parse(localStorage.getItem('imarthar_blogs')) || [];
    const blog = storedBlogs[id];

    if (!blog) {
      container.innerHTML = `
        <div class="not-found">
          <i class="ti ti-file-off"></i>
          <p>এই পোস্টটি খুঁজে পাওয়া যায়নি। হয়তো এই ব্রাউজারে এই পোস্ট নেই।</p>
          <a href="../blogs.html" class="back-link" style="justify-content:center; margin-top:1rem;"><i class="ti ti-arrow-left"></i> ব্লগ তালিকায় ফিরে যান</a>
        </div>
      `;
      return;
    }

    const img = blog.img ? `<img class="post-img" src="${blog.img}" alt="${blog.title}">` : '';

    container.innerHTML = `
      <a href="../blogs.html" class="back-link"><i class="ti ti-arrow-left"></i> সব ব্লগে ফিরে যান</a>
      <div class="post-tag">${blog.tag}</div>
      <h1 class="post-title">${blog.title}</h1>
      <div class="post-meta"><i class="ti ti-calendar-event"></i> ${blog.date}</div>
      ${img}
      <div class="post-body">${blog.body}</div>
    `;

    document.title = blog.title + " — ইমার ঠার";
  }

  window.onload = renderPost;
</script>

</body>
</html>
