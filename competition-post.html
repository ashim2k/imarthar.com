.back{display:inline-flex;gap:6px;font-size:14px;color:#64748b;text-decoration:none;margin-bottom:1rem}.back:hover{color:#10b981}
article{background:#fff;border:1px solid #e2e8f0;border-radius:16px;overflow:hidden}

.author{display:flex;align-items:center;gap:12px;padding-bottom:1.25rem;border-bottom:1px solid #e2e8f0;margin-bottom:1.5rem}
.av{width:40px;height:40px;border-radius:50%;background:#10b981;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}

.content{font-size:17px;color:#334155;line-height:2}.content p{margin-bottom:1.1rem}
.cta{margin-top:1.5rem;text-align:center;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:16px;padding:1.5rem;font-size:14px;color:#166534}
.cta a{display:inline-block;margin-top:.6rem;background:#10b981;color:#fff;text-decoration:none;font-weight:600;padding:9px 18px;border-radius:10px}
.state{max-width:500px;margin:4rem auto;text-align:center;background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:3rem 2rem;color:#64748b;font-size:14px}
footer{background:#fff;border-top:1px solid #e2e8f0;padding:2.5rem 2rem;text-align:center;font-size:13px;color:#64748b;margin-top:4rem}footer span{color:#10b981;font-weight:600}
@media(max-width:640px){.wrap{padding:0 1rem}.body{padding:1.25rem}h1{font-size:23px}nav{padding:0 1rem}.nav-links{gap:14px}}
</style>

</div>
<footer>© ২০২৬ <span>imarthar.com</span> • Developed by কুঙ্গ থাঙ<br><small style="color:#94a3b8">Preserving heritage through advanced computing systems.</small></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb=supabase.createClient('https://ksnwykmtrczvdzhoiews.supabase.co','sb_publishable_rDe8p4jNcIyz9THgpFUKrw_51BinZno');
const COLS='id,participant_name,category,institution_level,institution,age,language_variant,title,body,img_url,is_winner,published_at';
const $=id=>document.getElementById(id);
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const bn=n=>String(n).replace(/[0-9]/g,d=>'০১২৩৪৫৬৭৮৯'[d]);
const LV={primary:'প্রাথমিক বিদ্যালয়',secondary:'মাধ্যমিক বিদ্যালয়',college:'কলেজ'};
const MO=['জানুয়ারি','ফেব্রুয়ারি','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টেম্বর','অক্টোবর','নভেম্বর','ডিসেম্বর'];
(async()=>{
  const id=new URLSearchParams(location.search).get('id');
  const fail=m=>$('state').innerHTML=m+'<br><br><a class="back" href="competition.html">&larr; প্রতিযোগিতায় ফিরুন</a>';
  if(!id)return fail('কোনো লেখার আইডি পাওয়া যায়নি।');
  const {data:p,error}=await sb.from('competition_submissions').select(COLS).eq('id',id).eq('status','published').single();
  if(error||!p)return fail('লেখাটি পাওয়া যায়নি, অথবা এখনো প্রকাশিত হয়নি।');
  document.title=p.title+' — ইমার ঠার';
  $('cover').innerHTML=p.img_url?`<img class="cover" src="${esc(p.img_url)}" alt="${esc(p.title)}">`:'<div class="cover-ph"></div>';
  $('win').style.display=p.is_winner?'block':'none';
  const b=[`<span class="badge">${p.category==='student'?'শিক্ষার্থী বিভাগ':'উন্মুক্ত বিভাগ'}</span>`];
  if(p.category==='student'&&p.institution_level)b.push(`<span class="badge alt">${LV[p.institution_level]}</span>`);
  if(p.language_variant)b.push(`<span class="badge alt">${esc(p.language_variant)}</span>`);
  $('badges').innerHTML=b.join('');
  $('title').textContent=p.title;
  const ini=String(p.participant_name).trim().split(/\s+/);
  $('av').textContent=ini.length>1?ini[0][0]+ini[1][0]:ini[0].slice(0,2);
  $('an').textContent=p.participant_name;
  const info=[];
  if(p.category==='student'&&p.institution)info.push(p.institution);
  if(p.age)info.push('বয়স '+bn(p.age));
  if(p.published_at){const d=new Date(p.published_at);info.push(`${bn(d.getDate())} ${MO[d.getMonth()]} ${bn(d.getFullYear())}`);}
  $('ai').textContent=info.join(' • ');
  $('content').innerHTML=String(p.body).split(/\n+/).map(l=>l.trim()).filter(Boolean).map(l=>`<p>${esc(l)}</p>`).join('');
  $('state').style.display='none';$('wrap').style.display='block';
})();
addEventListener('scroll',()=>{const h=document.body.scrollHeight-innerHeight;$('bar').style.width=(h>0?Math.min(100,scrollY/h*100):0)+'%'});
</script>
